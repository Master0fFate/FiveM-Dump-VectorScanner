name: Scanner tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14.7']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q VectorSearch.py vector_scanner.py tests benchmarks
      - run: python -m unittest discover -s tests -v
  package-windows:
    name: Package and smoke-test Windows executable
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build standalone GUI
        run: python -m PyInstaller --noconfirm --clean VectorSearch.spec
      - name: Exercise the built executable
        shell: pwsh
        run: |
          $report = Join-Path $pwd 'dist/smoke-report.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/VectorSearch.exe') -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged smoke test failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.exported_matches -ne 2502) { throw 'Invalid smoke result' }
          Get-Content $report
      - name: Exercise the native Windows GUI backend
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          $report = Join-Path $pwd 'dist/smoke-report-native.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/VectorSearch.exe') -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Native packaged smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "Native packaged smoke test failed: $($process.ExitCode)" }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen -or $result.qt_platform -ne 'windows' -or $result.exported_matches -ne 2502) { throw 'Invalid native smoke result' }
          Get-Content $report
      - name: Record provenance and checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/VectorSearch.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  VectorSearch.exe" | Set-Content 'dist/SHA256SUMS.txt' -Encoding ascii
          @{ source_commit = $env:GITHUB_SHA; run_id = $env:GITHUB_RUN_ID; architecture = 'x64'; python = '3.14.7'; pyinstaller = '6.22.3'; signed = $false } | ConvertTo-Json | Set-Content 'dist/BUILD-INFO.json' -Encoding utf8
      - name: Preserve tested release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/VectorSearch.exe
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
            dist/smoke-report.json
            dist/smoke-report-native.json
      - name: Prepare bounded transfer parts
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          source = Path('dist/VectorSearch.exe')
          target = Path('dist/transfer')
          target.mkdir()
          parts = []
          digest = hashlib.sha256()
          with source.open('rb') as stream:
              for number in range(1, 5):
                  chunk = stream.read(20 * 1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
                  name = f'VectorSearch.exe.part{number:03d}'
                  (target / name).write_bytes(chunk)
                  parts.append({'name': name, 'size': len(chunk), 'sha256': hashlib.sha256(chunk).hexdigest()})
              if stream.read(1):
                  raise RuntimeError('Executable exceeds the configured four-part transfer limit')
          manifest = {'source_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                      'name': source.name, 'size': source.stat().st_size,
                      'sha256': digest.hexdigest(), 'parts': parts}
          assert manifest['sha256'] in Path('dist/SHA256SUMS.txt').read_text()
          (target / 'transfer-manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')
          print(json.dumps(manifest, indent=2))
      - name: Preserve transfer part 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-transfer-part001
          if-no-files-found: error
          retention-days: 30
          path: dist/transfer/VectorSearch.exe.part001
      - name: Preserve transfer part 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-transfer-part002
          if-no-files-found: ignore
          retention-days: 30
          path: dist/transfer/VectorSearch.exe.part002
      - name: Preserve transfer part 3 if needed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-transfer-part003
          if-no-files-found: ignore
          retention-days: 30
          path: dist/transfer/VectorSearch.exe.part003
      - name: Preserve transfer part 4 if needed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-transfer-part004
          if-no-files-found: ignore
          retention-days: 30
          path: dist/transfer/VectorSearch.exe.part004
      - name: Preserve transfer verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VectorSearch-transfer-metadata
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/transfer/transfer-manifest.json
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
            dist/smoke-report.json
            dist/smoke-report-native.json
